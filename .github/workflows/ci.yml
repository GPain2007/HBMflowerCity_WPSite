name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 13:37 UTC: catches new WordPress/plugin releases and any
    # change to the backed-up files even in weeks with no commits.
    - cron: "37 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Unit tests
        run: python -m pytest -q tests

      - name: PHP syntax check (root files)
        run: for f in *.php; do php -l "$f" >/dev/null || exit 1; done

      - name: Site checks (secrets, core and plugin integrity, updates, media)
        run: python scripts/check_site.py

      - name: Open an issue when the weekly run fails
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Weekly CI check failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "ci", per_page: 100,
            });
            const existing = open.find((i) => i.title === title);
            const body = `The scheduled CI run failed: ${runUrl}`;
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["ci"] });
            }
